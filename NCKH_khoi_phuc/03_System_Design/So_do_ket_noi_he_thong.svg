<svg viewBox="0 0 740 560" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Sơ đồ kết nối hệ thống mini SCADA</title>
<desc>Sơ đồ mức tín hiệu: máy tính WinCC và HMI eMT3070B nối PLC qua Ethernet/PROFINET; PLC điều khiển biến tần Wecon VNZ100-1R5G-2 (chạy và tốc độ), nhận báo lỗi từ biến tần, nhận dữ liệu đồng hồ đo Selec MFM383A-C qua RS485, nhận nhiệt độ qua PT100 và bộ chuyển đổi tín hiệu; biến tần nhận nguồn vào 1 pha 220V và cấp điện động lực 3 pha cho động cơ.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#333" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>
<rect x="0" y="0" width="740" height="560" fill="#ffffff"/>
<g fill="#E6F1FB" stroke="#185FA5">
<rect x="60" y="20" width="180" height="60" rx="12" stroke-width="1"/>
</g>
<text x="150" y="46" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#0C447C">Máy tính WinCC</text>
<text x="150" y="63" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#185FA5">Giám sát trung tâm</text>
<g fill="#E6F1FB" stroke="#185FA5">
<rect x="500" y="20" width="180" height="60" rx="12" stroke-width="1"/>
</g>
<text x="590" y="46" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#0C447C">HMI eMT3070B</text>
<text x="590" y="63" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#185FA5">Giám sát tại chỗ</text>
<g fill="#B5D4F4" stroke="#0C447C">
<rect x="270" y="130" width="200" height="70" rx="12" stroke-width="1"/>
</g>
<text x="370" y="160" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#042C53">PLC S7-1200</text>
<text x="370" y="178" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#0C447C">CPU 1211C — trung tâm</text>
<line x1="150" y1="80" x2="330" y2="128" stroke="#333" stroke-width="1.2" marker-end="url(#arrow)"/>
<text x="150" y="105" text-anchor="start" font-family="sans-serif" font-size="12" fill="#333">PROFINET/Ethernet</text>
<line x1="590" y1="80" x2="410" y2="128" stroke="#333" stroke-width="1.2" marker-end="url(#arrow)"/>
<text x="470" y="105" text-anchor="start" font-family="sans-serif" font-size="12" fill="#333">Ethernet</text>
<g fill="#FAEEDA" stroke="#854F0B">
<rect x="70" y="250" width="190" height="80" rx="12" stroke-width="1"/>
</g>
<text x="165" y="278" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#412402">Biến tần VNZ100-1R5G-2</text>
<text x="165" y="296" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#854F0B">Input 1PH 220V · FWD/REV, FIV/FIC</text>
<text x="165" y="312" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#854F0B">RA/RB/RC báo lỗi</text>
<g fill="#FAEEDA" stroke="#854F0B">
<rect x="480" y="250" width="190" height="80" rx="12" stroke-width="1"/>
</g>
<text x="575" y="278" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#412402">Đồng hồ đo MFM383A-C</text>
<text x="575" y="296" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#854F0B">RS485 / Modbus RTU</text>
<text x="575" y="312" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#854F0B">Qua CT + PT</text>
<line x1="330" y1="200" x2="220" y2="248" stroke="#333" stroke-width="1.2" marker-end="url(#arrow)"/>
<text x="225" y="225" text-anchor="start" font-family="sans-serif" font-size="12" fill="#333">Chạy + tốc độ</text>
<line x1="220" y1="250" x2="330" y2="202" stroke="#333" stroke-width="1.2" marker-end="url(#arrow)"/>
<line x1="480" y1="280" x2="472" y2="200" stroke="#333" stroke-width="1.2" marker-end="url(#arrow)"/>
<text x="480" y="225" text-anchor="start" font-family="sans-serif" font-size="12" fill="#333">RS485</text>
<g fill="#FAEEDA" stroke="#854F0B">
<rect x="70" y="400" width="190" height="70" rx="12" stroke-width="1"/>
</g>
<text x="165" y="428" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#412402">Động cơ 3 pha</text>
<text x="165" y="446" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#854F0B">Không đồng bộ, ~1,5kW (theo VFD)</text>
<line x1="165" y1="330" x2="165" y2="398" stroke="#333" stroke-width="1.2" marker-end="url(#arrow)"/>
<text x="180" y="368" text-anchor="start" font-family="sans-serif" font-size="12" fill="#333">Cáp động lực 3 pha</text>
<g fill="#FAEEDA" stroke="#854F0B">
<rect x="480" y="400" width="190" height="70" rx="12" stroke-width="1"/>
</g>
<text x="575" y="424" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#412402">PT100 + bộ chuyển đổi</text>
<text x="575" y="442" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#854F0B">Gắn tại cuộn dây động cơ</text>
<text x="575" y="458" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#854F0B">Ra 0-10V / 4-20mA</text>
<line x1="480" y1="430" x2="472" y2="202" stroke="#333" stroke-width="1.2" marker-end="url(#arrow)"/>
<text x="600" y="330" text-anchor="start" font-family="sans-serif" font-size="12" fill="#333">Analog vào PLC</text>
<text x="370" y="530" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#555">Xanh = lớp điều khiển và giám sát · Cam = lớp công suất và đo lường</text>
<text x="370" y="548" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#555">Chi tiết I/O cần xác nhận theo module mở rộng PLC thật sẽ dùng</text>
</svg>
